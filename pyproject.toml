[project]
name = "shine-email-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40.0",
    "google-api-python-client>=2.140.0",
    "google-auth>=2.34.0",
    "google-auth-oauthlib>=1.2.0",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.30",
    "pyyaml>=6.0.2",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "markdown>=3.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
markers = [
    "integration: tests that hit real Gmail or Claude APIs (cost money, require credentials)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
